# ============================================================
# YTX Order Print Configuration
# ============================================================


# ============================================================
# Page
# ============================================================

[page]

# Paper size: A4 / A5
page_size=A5

# Page orientation: landscape / portrait
orientation=landscape

# Default font size
font_size=12

# Page margins
margin_left=20
margin_right=20
margin_top=15
margin_bottom=15


# ============================================================
# Company
# Company information used for printing.
# All company information is configured directly in this file.
# Empty fields will not be printed.
# ============================================================

[company]

# Show company logo
show_logo=false
logo=

# Show company name
show_name=true
name=

# Show company address
show_address=true
address=

# Show company phone
show_phone=true
phone=


# ============================================================
# Header
# ============================================================

[header]

# Order title
show_title=true
title=

# Partner / customer name
show_partner=true

# Order code
show_code=true

# Issued time
show_issued_time=true

# Settlement type, e.g. 现结 / 月结 / 挂账
show_settlement=true


# ============================================================
# Table
# ============================================================

[table]

# Draw Excel-like borders
show_border=true

# Show table column header row
show_header=true

# Minimum height of each data row
row_height=30

# Columns to display and their order.
#
# Available fields:
# internal_sku
# external_sku
# description
# count
# measure
# unit_price
# amount
#
columns=internal_sku,external_sku,description,count,measure,unit_price,amount

# Relative column width weights, corresponding one-to-one with "columns"
column_widths=100,80,140,60,60,80,100


# ============================================================
# Table Column Titles
# Allows customer-specific column names without changing code.
# ============================================================

[column_titles]

internal_sku=内部货号
external_sku=外部货号
description=描述
count=计数
measure=度量
unit_price=单价
amount=金额


# ============================================================
# Total
# ============================================================

[total]

# Show total section
enabled=true

# Show "合计" label
show_title=true
title=合计

# Show uppercase Chinese amount
show_upper=true

# Show numeric amount
show_amount=true


# ============================================================
# Remark / After-sale Instructions
#
# Large merged-cell-like block below the total.
# If enabled=false, the entire block is skipped.
# ============================================================

[remark]

enabled=true

# Show remark title
show_title=true
title=备注：

# Multi-line text. Use \n for line breaks.
text=

# Inner padding
padding=6

# Draw border around the whole remark block
show_border=true


# ============================================================
# Footer
# ============================================================

[footer]

# Employee / salesperson
show_employee=true
employee_title=送货人：

# Page information, e.g. 1 / 2
show_page_info=true