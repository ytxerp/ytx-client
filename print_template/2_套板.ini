[page]
# Paper size for the page, either A4 or A5
page_size=A5

# Page orientation: landscape or portrait
orientation=landscape

# Font size in points
font_size=12

# Print mode: overlay uses a pre-printed paper template
mode=overlay


[header]
# Header field positions, in centimeters (cm)
# Format: x,y
# x: horizontal distance from the left
# y: vertical distance from the top

# Partner field position
partner=0.8,0.8

# Issued date position
issued_time=16.5,0.8

# Order code position
code=16.5,1.4


[table]
# Top-left position of the table, in centimeters (cm)
left_top=0.8,2.2

# Maximum number of detail rows per page
rows=7

# Height of each table row, in centimeters (cm)
row_height=0.8

# Table columns and their display order
columns=internal_sku,external_sku,description,count,measure,unit_price,amount

# Physical width of each column, in centimeters (cm)
# The widths correspond to the columns above in the same order:
# internal_sku  = 3.5 cm
# external_sku  = 2.8 cm
# description   = 1.5 cm
# count         = 2.5 cm
# measure       = 2.5 cm
# unit_price    = 2.2 cm
# amount        = 3.5 cm
column_widths=3.5,2.8,1.5,2.5,2.5,2.2,3.5


[footer]
# Footer field positions, in centimeters (cm)
# Format: x,y

# Employee field position
employee=0.8,14.0

# Initial total amount position
initial_total=4.0,14.0

# Initial total amount in uppercase position
initial_total_upper=8.0,14.0

# Unit and direction field position
unit=15.5,14.0

# Page information position, e.g. 1/2
page_info=19.0,14.0